<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WORK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WORK">
<style>
/* Layout: iPad横=左サイドバー＋右コンテンツ / 縦・スマホ=下タブバー。iOS純正風のガラス面に、業務ごとの色帯で区分を示す */
:root{
  /* ライト＝オフホワイト×オレンジ、差し色ブルー／ダーク＝ネイビー×オレンジ、差し色ブルー */
  --bg:#f7f5f1;
  --glass:rgba(255,255,255,.78);
  --glass-strong:rgba(255,255,255,.96);
  --seg:rgba(20,33,61,.07);
  --line:rgba(20,33,61,.10);
  --fg:#14213d;
  --muted:#58637a;
  --faint:#9aa1ae;
  --accent:#ea5f12;
  --on-accent:#ffffff;
  --genba:#2f6fe4;
  --nk:#d98a1f;
  --ark:#1b9585;
  --me:#6a5ed0;
  --danger:#d33a3a;
  --warn:#b8760d;
  --ok:#1d9a6a;
  --blob-a:rgba(234,95,18,.13);
  --blob-b:rgba(47,111,228,.11);
  --blob-c:rgba(20,33,61,.06);
  --shadow:0 10px 30px rgba(20,33,61,.08);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1829;--glass:rgba(22,36,62,.74);--glass-strong:rgba(33,51,85,.96);--seg:rgba(160,182,224,.12);
  --line:rgba(180,200,240,.12);--fg:#eef2f8;--muted:#a3aec4;--faint:#6b7891;--accent:#ff7a2e;--on-accent:#0e1829;
  --genba:#5c95ff;--nk:#f2b24b;--ark:#3cc4b1;--me:#9a8fff;--danger:#ff6b6b;--warn:#f0b429;--ok:#3ccf91;
  --blob-a:rgba(255,122,46,.13);--blob-b:rgba(92,149,255,.16);--blob-c:rgba(40,70,130,.35);--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1829;--glass:rgba(22,36,62,.74);--glass-strong:rgba(33,51,85,.96);--seg:rgba(160,182,224,.12);
  --line:rgba(180,200,240,.12);--fg:#eef2f8;--muted:#a3aec4;--faint:#6b7891;--accent:#ff7a2e;--on-accent:#0e1829;
  --genba:#5c95ff;--nk:#f2b24b;--ark:#3cc4b1;--me:#9a8fff;--danger:#ff6b6b;--warn:#f0b429;--ok:#3ccf91;
  --blob-a:rgba(255,122,46,.13);--blob-b:rgba(92,149,255,.16);--blob-c:rgba(40,70,130,.35);--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  background-image:radial-gradient(40rem 30rem at 0% 0%,var(--blob-a),transparent 70%),radial-gradient(36rem 28rem at 100% 10%,var(--blob-b),transparent 70%),radial-gradient(40rem 30rem at 60% 100%,var(--blob-c),transparent 70%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
main{min-width:0;width:100%;max-width:1120px;margin:0 auto;padding-block:18px 100px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:860px){
  .app{grid-template-columns:220px 6px minmax(0,1fr) 6px 380px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:26px 14px;
    padding-left:max(14px,env(safe-area-inset-left,0px));
    background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-right:1px solid var(--line)}
  .tabbar{display:none!important}
  main{padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
  .only-narrow{display:none!important}
}
.brand{font-weight:800;font-size:19px;letter-spacing:.04em;padding:0 10px 18px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
.navbtn svg{width:21px;height:21px}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:auto}
.navbtn.on{background:var(--glass-strong);color:var(--fg);box-shadow:var(--shadow)}
.navbtn.on svg{color:var(--accent)}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.paneclose{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.paneclose:hover{background:var(--seg)}
.paneclose svg{width:18px;height:18px}
/* 仕切り（ドラッグで幅変更） */
.split{display:none;position:relative;cursor:col-resize;touch-action:none;
  background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
.split::after{content:"";position:sticky;top:45vh;display:block;margin:45vh auto 0;width:4px;height:44px;border-radius:4px;background:var(--faint);opacity:.55}
.split:hover::after,.split.drag::after,.split:focus-visible::after{background:var(--accent);opacity:1}
/* 右：AIチャット */
.aipane{display:none;min-width:0}
.ai-in{display:flex;flex-direction:column;gap:10px;height:100%;padding:18px 16px}
.ai-in .ai-head{margin:0}
.ai-in .chat{flex:1;min-height:0;max-height:none;margin:0}
.turn{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:none}
.ai-empty{flex:1;justify-content:flex-start!important;display:flex;flex-direction:column;justify-content:center;gap:8px;color:var(--muted);font-size:13.5px;padding:8px}
.ai-empty b{color:var(--fg);font-size:15px}
.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (min-width:860px){
  .split{display:block}
  .aipane{display:block;position:sticky;top:0;height:100vh;
    background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-left:1px solid var(--line)}
  .ai-in{padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:859px){
  .aipane{display:block;position:fixed;inset:0;z-index:40;background:var(--bg)}
  .ai-in{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.side .spacer{flex:1}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
h1{font-size:30px;line-height:1.2;margin:2px 0 0;font-weight:800;letter-spacing:.01em;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}

.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;padding:10px 14px;border-radius:14px;
  background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice .grow{flex:1;min-width:180px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .lab{font-size:12px;font-weight:700;color:var(--muted)}
.stat .val{font-family:var(--num);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
.stat.alert .val{color:var(--danger)}

.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;font-variant-numeric:tabular-nums}
.day .w{font-size:11px;font-weight:700;color:var(--muted)}
.day .n{font-family:var(--num);font-size:18px;font-weight:700}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day.today .n{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.sel .w,.day.sel .n{color:var(--on-accent)}
.day.sun .w{color:var(--danger)}
.navarrow{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.navarrow svg{width:18px;height:18px}

.row{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
.time{font-family:var(--num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;width:46px;flex:none}
.rbody{flex:1;min-width:0}
.rtitle{font-weight:600;overflow-wrap:anywhere}
.rtitle.struck{text-decoration:line-through;color:var(--faint)}
.rmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;margin:0 10px}
.chk svg{width:15px;height:15px;opacity:0;stroke:var(--on-accent);stroke-width:3}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{opacity:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent);color:var(--c,var(--muted));white-space:nowrap}
.pill.accent{--c:var(--accent)}.pill.danger{--c:var(--danger)}.pill.ok{--c:var(--ok)}.pill.warn{--c:var(--warn)}
.ghead{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted);padding:14px 2px 2px;letter-spacing:.03em}
.ghead:first-child{padding-top:2px}
.empty{padding:22px 8px;text-align:center;color:var(--faint);font-size:13.5px}

.seg{display:inline-flex;background:var(--seg);padding:3px;border-radius:12px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--glass-strong);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--seg);color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--accent);color:var(--on-accent)}
.btn.sub{background:var(--seg);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px}
.link{color:var(--accent);font-weight:700;font-size:13px}

.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.deal{display:flex;flex-direction:column;gap:6px;padding:14px;border-left:4px solid var(--c)}
.deal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deal-top b{font-size:16px;overflow-wrap:anywhere}
.deal-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.psel{appearance:none;-webkit-appearance:none;border:none;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}

.bar{height:8px;border-radius:99px;background:var(--seg);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.45}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.prow:last-child{border-bottom:none}
.prow .nm{font-weight:700;text-align:left}
.prow .num{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums}
.prow .bar{grid-column:1/-1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--seg);font-weight:800;font-size:18px;line-height:1}
.big{font-family:var(--num);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}

.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.shift{border-collapse:separate;border-spacing:4px;min-width:540px;width:100%;font-variant-numeric:tabular-nums}
.shift th{font-size:12px;font-weight:700;color:var(--muted);padding:2px 0}
.shift th.today{color:var(--accent)}
.shift td.mname{font-weight:700;font-size:13.5px;white-space:nowrap;padding-right:6px}
.scell{width:100%;height:38px;border-radius:10px;background:var(--seg);font-weight:800;font-size:14px;color:var(--muted)}
.scell.s-出{background:color-mix(in srgb,var(--nk) 20%,transparent);color:var(--nk)}
.scell.s-休{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.scell.s-有{background:color-mix(in srgb,var(--me) 18%,transparent);color:var(--me)}
.shift tfoot td{text-align:center;font-size:12.5px;font-weight:800}
.short{color:var(--danger)}

.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ad{display:flex;flex-direction:column;gap:10px}
.ad .kv{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.ad input[type=date]{background:var(--seg);border:none;border-radius:8px;padding:4px 8px;font-size:13px}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mon h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.mon.now{outline:2px solid var(--accent);outline-offset:-2px}

.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--seg) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:14px}

.ai{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.spark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--genba));font-weight:800}
.ai-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;min-width:0;resize:vertical;min-height:44px;max-height:200px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong)}
.ai-out{margin-top:12px;padding:14px;border-radius:14px;background:var(--glass-strong);font-size:14px;line-height:1.75;overflow-wrap:anywhere}
.ai-out .src{font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}

.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:6px;
  margin:-6px 0 16px;padding:6px 8px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:var(--glass-strong);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);scrollbar-width:none}
.lscroll{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lscroll::-webkit-scrollbar{display:none}
.lt{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;text-decoration:none;color:var(--fg);border-radius:10px}
.lt:hover{background:var(--seg)}
.lt .lic{width:34px;height:34px;border-radius:10px;font-size:11.5px}
.lt .lic.add svg{width:16px;height:16px}
.lt .lnm{font-size:10px;max-width:56px}
.lt.edit .lic{animation:jig .3s ease-in-out infinite alternate}
.lbar-edit{flex:none;margin-left:auto;min-width:34px;height:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px;border-left:1px solid var(--line);border-radius:0 10px 10px 0;padding-left:10px}
.lbar-edit svg{width:17px;height:17px}
.lbar-edit.on{color:var(--on-accent);background:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sheetwrap{max-height:70vh;overflow:auto}
.sheetwrap[data-fit]{max-height:none}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--glass-strong);color:var(--muted);font-weight:700;font-size:11.5px}
.grid tbody th{position:sticky;left:0;z-index:1;background:var(--glass-strong);color:var(--faint);font-weight:600;font-size:11px;text-align:right}
.grid tbody tr:first-child td{font-weight:700;background:color-mix(in srgb,var(--genba) 8%,transparent)}
.grid td{cursor:pointer}.grid td:hover{background:var(--seg)}
.grid td.fx{color:var(--muted);font-style:italic;cursor:default}
.embed{padding:0;overflow:hidden}
.embed iframe{display:block;width:100%;height:60vh;min-height:300px;border:0;background:#fff}
html,body{overscroll-behavior:none}
main.fit{padding-bottom:12px}
@media (max-width:859px){main.fit{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
.launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 8px}
.ltile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--fg);padding:4px 0;border-radius:14px;min-width:0}
.lic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--c);
  background:color-mix(in srgb,var(--c) 15%,var(--glass-strong));border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.lic.add{--c:var(--muted);border-style:dashed}.lic.add svg{width:22px;height:22px}
.ltile.edit .lic{animation:jig .3s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.ltile.edit .lic{animation:none}}
.lnm{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;margin-bottom:12px;padding:2px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--glass-strong);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .src{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
.addbtn{background:var(--accent);color:var(--on-accent);border-color:transparent}
.addbtn svg{stroke-width:2.4}
.fab{position:fixed;z-index:21;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);
  right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
.fab svg{width:26px;height:26px;stroke-width:2.4}
@media (min-width:860px){.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}}

.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--glass-strong);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:22px 22px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);border:1px solid var(--line)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
.sheet h3{margin:0 0 14px;font-size:18px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f > span{font-size:12.5px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.f textarea{min-height:90px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.sheet-actions .r{display:flex;gap:8px;margin-left:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:60;
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13.5px}
.setrow{display:flex;flex-direction:column;gap:10px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--seg);padding:1px 6px;border-radius:6px}
*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style>
</head>
<body>

<div class="app" id="app">
  <nav class="side" id="side"></nav>
  <div class="split" id="splitL" data-split="left" role="separator" aria-orientation="vertical" aria-label="メニューの幅を変える" tabindex="0"></div>
  <main id="main"></main>
  <div class="split" id="splitR" data-split="right" role="separator" aria-orientation="vertical" aria-label="AIチャットの幅を変える" tabindex="0"></div>
  <aside class="aipane" id="aipane" aria-label="AIチャット"></aside>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 基本 ===== */
const KEY='bucchi_work_v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date());
const THIS_MONTH=TODAY.slice(0,7);
const WD='日月火水木金土';
const fmtD=s=>{const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mondayOf=s=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const curMonthNum=Number(TODAY.slice(5,7));
const mAdd=k=>((curMonthNum-1+k)%12)+1;

const AREAS={
  genba:{name:'現場',full:'ベイシア電器 前橋モール店',c:'var(--genba)',tags:['来店予約','研修','商談','店舗調整']},
  nk:{name:'NK',full:'ニュー・クーキー',c:'var(--nk)',tags:['シフト','広告','会議','採用','年間']},
  ark:{name:'ARKZOO',full:'ARKZOO',c:'var(--ark)',tags:['Google','フォーム','マップ']},
  me:{name:'個人',full:'個人',c:'var(--me)',tags:['用事','予定']}
};
const AREA_DEF={genba:{name:'現場',full:'ベイシア電器 前橋モール店'},nk:{name:'NK',full:'ニュー・クーキー'},ark:{name:'ARKZOO',full:'法人立ち上げ・Web対応'},me:{name:'個人',full:'プライベートの予定'}};
const STAGES=['見込み','来店予約','商談中','成約','失注'];
const STAGE_C={'見込み':'var(--muted)','来店予約':'var(--genba)','商談中':'var(--warn)','成約':'var(--ok)','失注':'var(--danger)'};
const SHIFT_CYCLE=['','出','休','有'];

const I={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  genba:'<path d="M3 9l1.6-5h14.8L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',
  nk:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  ark:'<path d="M4 21V5l8-2v18M12 21V9l8 3v9M2 21h20M7 8h2M7 12h2M7 16h2M15 14h2M15 17h2"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/>',
  set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  edit:'<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 7.5 3 3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  l:'<path d="m15 5-7 7 7 7"/>', r:'<path d="m9 5 7 7-7 7"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  side:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/>',
  chat:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/><path d="M8.5 9.5h7M8.5 12.5h4"/>',
  auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>'
};
const THEMES=[['auto','自動'],['light','ライト'],['dark','ダーク']];
let theme='auto';try{theme=localStorage.getItem(KEY+'_theme')||'auto'}catch(e){}
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme)}
applyTheme();
const ic=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const NAV=[['home','ホーム'],['genba','現場'],['nk','NK'],['ark','ARKZOO'],['me','個人'],['set','設定']];

/* ===== データ ===== */
function arkTasks(){return [
  {id:uid(),area:'ark',kind:'task',tag:'Google',title:'法人Googleアカウントの作成',date:addDays(TODAY,3),done:false},
  {id:uid(),area:'ark',kind:'task',tag:'フォーム',title:'サイトに近いデザインの問い合わせフォーム作成',date:addDays(TODAY,7),done:false},
  {id:uid(),area:'ark',kind:'task',tag:'マップ',title:'Googleマップ（ビジネスプロフィール）対応',date:addDays(TODAY,10),done:false}
]}
function defaultAds(){return [
  {id:uid(),name:'Indeed',status:'準備中',apply:0,next:'',memo:''},
  {id:uid(),name:'求人ボックス',status:'準備中',apply:0,next:'',memo:''},
  {id:uid(),name:'Instagram',status:'準備中',apply:0,next:'',memo:''}
]}
function sample(){
  const t=TODAY,mon=mondayOf(t);
  const members=['メンバーA','メンバーB','メンバーC','メンバーD','メンバーE'];
  const shifts={};
  members.forEach((m,j)=>{for(let i=0;i<7;i++){const v=((i+j*2)%7>=5)?'休':'出';shifts[m+'|'+addDays(mon,i)]=v}});
  shifts['メンバーC|'+addDays(mon,3)]='有';shifts['メンバーA|'+addDays(mon,5)]='休';shifts['メンバーD|'+addDays(mon,5)]='休';
  return {
    sample:true,
    items:[
      {id:uid(),area:'genba',kind:'event',tag:'来店予約',title:'来店予約 Kさま（機種変更の相談）',date:t,time:'11:00'},
      {id:uid(),area:'genba',kind:'event',tag:'研修',title:'新人研修（料金プランの説明）',date:t,time:'14:00'},
      {id:uid(),area:'me',kind:'event',tag:'予定',title:'ジム',date:t,time:'20:00'},
      {id:uid(),area:'nk',kind:'task',tag:'広告',title:'Indeedの求人原稿を仕上げる',date:t,done:false},
      {id:uid(),area:'nk',kind:'task',tag:'シフト',title:'翌月シフトを確定してLINE WORKSで共有',date:addDays(t,2),done:false},
      {id:uid(),area:'nk',kind:'event',tag:'会議',title:'定例ミーティング',date:addDays(t,1),time:'10:00'},
      {id:uid(),area:'genba',kind:'event',tag:'来店予約',title:'来店予約 Sさま（光回線の乗り換え）',date:addDays(t,1),time:'15:30'},
      {id:uid(),area:'genba',kind:'task',tag:'店舗調整',title:'売場の販促物の差し替え',date:addDays(t,-1),done:false},
      {id:uid(),area:'me',kind:'task',tag:'用事',title:'車の点検予約',date:addDays(t,4),done:false},
      ...arkTasks()
    ],
    deals:[
      {id:uid(),name:'Kさま',content:'iPhone機種変更＋光回線',stage:'商談中',next:t},
      {id:uid(),name:'Sさま',content:'光回線の乗り換え',stage:'来店予約',next:addDays(t,1)},
      {id:uid(),name:'Tさま',content:'家族3回線のプラン見直し',stage:'見込み',next:''},
      {id:uid(),name:'Mさま',content:'新規回線＋タブレット',stage:'成約',next:''},
      {id:uid(),name:'Hさま',content:'料金の見直し',stage:'失注',next:''}
    ],
    results:{month:THIS_MONTH,history:[],products:[
      {id:uid(),name:'新規回線',target:20,actual:12},{id:uid(),name:'機種変更',target:30,actual:19},
      {id:uid(),name:'光回線',target:8,actual:3},{id:uid(),name:'クレジットカード',target:15,actual:10},{id:uid(),name:'でんき',target:5,actual:2}]},
    members,shifts,minStaff:3,
    ads:[
      {id:uid(),name:'Indeed',status:'掲載中',apply:3,next:addDays(t,6),memo:'無料掲載'},
      {id:uid(),name:'求人ボックス',status:'準備中',apply:0,next:addDays(t,2),memo:'原稿作成中'},
      {id:uid(),name:'Instagram',status:'運用中',apply:1,next:addDays(t,-1),memo:'協力会社との接点づくりも兼ねる'}
    ],
    yearplan:[
      {id:uid(),month:mAdd(0),title:'下期の採用計画を固める',done:false},
      {id:uid(),month:mAdd(1),title:'年末商戦の人員配置',done:false},
      {id:uid(),month:mAdd(2),title:'年末年始シフトの確定',done:false},
      {id:uid(),month:mAdd(3),title:'初売り体制の準備',done:false},
      {id:uid(),month:mAdd(5),title:'新生活商戦の準備',done:false},
      {id:uid(),month:mAdd(6),title:'新人受け入れ・研修計画',done:false}
    ],
    settings:{apiKey:'',model:'gemini-3.8-flash'}
  };
}
function blank(settings){
  return {sample:false,launcher:(S&&S.launcher)||defaultLaunch(),items:arkTasks(),deals:[],results:{month:THIS_MONTH,history:[],products:[]},
    members:[],shifts:{},minStaff:3,ads:defaultAds(),yearplan:[],settings:settings||{apiKey:'',model:'gemini-3.8-flash'}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.items)return o}}catch(e){}return sample()}
let S=load();
const LCOLORS=[['var(--accent)','オレンジ'],['var(--genba)','ブルー'],['var(--nk)','アンバー'],['var(--ark)','ティール'],['var(--me)','ラベンダー'],['var(--fg)','ネイビー']];
function defaultLaunch(){return [
  {id:uid(),name:'Gmail',url:'googlegmail://',color:'var(--accent)'},
  {id:uid(),name:'カレンダー',url:'https://calendar.google.com/',color:'var(--genba)'},
  {id:uid(),name:'スプレッドシート',url:'https://docs.google.com/spreadsheets/',color:'var(--ark)'},
  {id:uid(),name:'ドライブ',url:'https://drive.google.com/',color:'var(--nk)'},
  {id:uid(),name:'LINE WORKS',url:'https://talk.worksmobile.com/',color:'var(--ark)'},
  {id:uid(),name:'LINE',url:'line://',color:'var(--ok)'},
  {id:uid(),name:'Claude',url:'https://claude.ai/new',color:'var(--accent)'},
  {id:uid(),name:'Instagram',url:'https://www.instagram.com/',color:'var(--me)'}
]}
if(!S.launcher){S.launcher=defaultLaunch()}
S.launcher.forEach(a=>{if(a.url==='https://mail.google.com/')a.url='googlegmail://'});
if(!S.names)S.names={app:'WORK'};
if(!S.conn)S.conn={sheet:{url:'',token:'',open:''},cal:{url:'',token:''}};
if(!S.embeds)S.embeds=[];
if(!S.gcal)S.gcal={at:0,events:[]};
function appName(){return (S.names&&S.names.app)||'WORK'}
function applyNames(){Object.keys(AREAS).forEach(k=>{const n=(S.names&&S.names[k])||{};AREAS[k].name=n.name||AREA_DEF[k].name;AREAS[k].full=n.full||AREA_DEF[k].full})}
applyNames();
if(!S.settings.model||S.settings.model==='gemini-2.5-flash')S.settings.model='gemini-3.8-flash';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const MQ=window.matchMedia('(min-width:860px)');
const LAY_DEF={lw:220,rw:380,lOpen:true,rOpen:true};
let LAY={...LAY_DEF};try{Object.assign(LAY,JSON.parse(localStorage.getItem(KEY+'_layout')||'{}'))}catch(e){}
function saveLay(){try{localStorage.setItem(KEY+'_layout',JSON.stringify(LAY))}catch(e){}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let ui={view:'home',seg:{genba:'deal',nk:'shift'},sel:TODAY,week:mondayOf(TODAY),shiftWeek:mondayOf(TODAY),dealF:'open',past:false,aiBusy:false,aiDraft:'',chat:[],lEdit:false,aiMobile:false,sh:{list:[],values:[],formulas:[]},emb:''};
try{const v=localStorage.getItem(KEY+'_view');if(v&&NAV.some(n=>n[0]===v))ui.view=v}catch(e){}

/* ===== 共通パーツ ===== */
function hdr(title,sub){return `<header class="top"><div style="min-width:0"><div class="eyebrow">${sub}</div><h1>${title}</h1></div><div style="display:flex;gap:8px">${MQ.matches&&!LAY.lOpen?`<button class="iconbtn" data-act="lOpen" aria-label="メニューを開く">${ic('side')}</button>`:''}${!MQ.matches||!LAY.rOpen?`<button class="iconbtn" data-act="rOpen" aria-label="AIチャットを開く" style="color:var(--accent)">${ic('chat')}</button>`:''}${ui.view!=='set'?`<button class="iconbtn addbtn" data-act="add" aria-label="追加">${ic('plus')}</button>`:''}<button class="iconbtn" data-act="themeCycle" aria-label="表示：${THEMES.find(t=>t[0]===theme)[1]}（タップで切り替え）" title="表示：${THEMES.find(t=>t[0]===theme)[1]}">${ic(theme)}</button><button class="iconbtn only-narrow" data-act="nav" data-v="set" aria-label="設定">${ic('set')}</button></div></header>`}
function seg(g,opts,cur){return `<div class="seg" role="tablist">${opts.map(([k,l])=>`<button class="${k===cur?'on':''}" data-act="seg" data-g="${g}" data-k="${k}">${l}</button>`).join('')}</div>`}
function gItems(){return (S.gcal&&S.gcal.events||[]).map(e=>({id:'g_'+e.gid,gid:e.gid,area:'me',kind:'event',tag:'Google',title:e.title,date:e.date,time:e.time,end:e.end,allDay:e.allDay,location:e.location,google:true}))}
function allItems(){return S.items.concat(gItems())}
function sortItems(a){return [...a].sort((x,y)=>{
  const rx=x.kind==='event'?(x.time?0:1):2,ry=y.kind==='event'?(y.time?0:1):2;
  if(rx!==ry)return rx-ry;return (x.time||'').localeCompare(y.time||'')||(x.date||'').localeCompare(y.date||'')})}
function rowItem(i,o={}){
  const A=AREAS[i.area]||AREAS.me;
  const overdue=i.kind==='task'&&!i.done&&i.date&&i.date<TODAY;
  const lead=i.kind==='task'
    ?`<button class="chk ${i.done?'on':''}" data-act="toggle" data-id="${i.id}" aria-label="${i.done?'未完了に戻す':'完了にする'}">${ic('check')}</button>`
    :`<span class="time">${esc(i.time||'終日')}</span>`;
  return `<div class="row" data-act="edit" data-id="${i.id}">
    <span class="stripe" style="--c:${A.c}"></span>${lead}
    <div class="rbody"><div class="rtitle ${i.done?'struck':''}">${esc(i.title)}</div>
    <div class="rmeta"><span class="pill" style="--c:${A.c}">${esc(A.name)}</span>${i.tag?`<span>${esc(i.tag)}</span>`:''}${o.date&&i.date?`<span>${fmtD(i.date)}${i.kind==='event'&&i.time?' '+esc(i.time):''}</span>`:''}${overdue?'<span class="pill danger">期限切れ</span>':''}</div></div></div>`;
}
function grouped(list,empty){
  if(!list.length)return `<div class="empty">${empty}</div>`;
  const g={};list.forEach(i=>{(g[i.date||'~']??=[]).push(i)});
  return Object.keys(g).sort().map(d=>`<div class="ghead">${d==='~'?'日付なし':fmtD(d)}${d===TODAY?'<span class="pill accent">今日</span>':''}${d!=='~'&&d<TODAY?'<span class="pill">過去</span>':''}</div>${sortItems(g[d]).map(i=>rowItem(i)).join('')}`).join('');
}
function areaList(area){
  const all=allItems().filter(i=>i.area===area);
  const list=ui.past?all:all.filter(i=>!i.date||i.date>=TODAY||(i.kind==='task'&&!i.done));
  const hidden=all.length-list.length;
  return `<div class="card"><div class="card-h"><h2>予定・タスク</h2>${(hidden||ui.past)?`<button class="link" data-act="past">${ui.past?'過去を隠す':`過去の${hidden}件を表示`}</button>`:''}</div>${grouped(list,'まだ何もないよ。右下の＋から追加してね')}</div>`;
}
function achRate(){const p=S.results.products;const t=p.reduce((s,x)=>s+(+x.target||0),0),a=p.reduce((s,x)=>s+(+x.actual||0),0);return {t,a,rate:t?Math.round(a/t*100):0}}
function monthPace(){const d=new Date();const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return Math.round(d.getDate()/dim*100)}

let sheetCb=null;
function openSheet({title,fields,onSave,onDelete,note}){
  const f=fields.map(x=>{
    const id='f_'+x.k;let inp;
    if(x.type==='select')inp=`<select id="${id}">${x.opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(x.val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
    else if(x.type==='textarea')inp=`<textarea id="${id}">${esc(x.val)}</textarea>`;
    else inp=`<input id="${id}" type="${x.type||'text'}" value="${esc(x.val??'')}" ${x.list?`list="dl_${x.k}"`:''}>${x.list?`<datalist id="dl_${x.k}">${x.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
    return {half:x.half,h:`<label class="f"><span>${x.label}</span>${inp}${x.hint?`<span class="hint">${x.hint}</span>`:''}</label>`};
  });
  let html='',buf=[];
  f.forEach(x=>{if(x.half){buf.push(x.h);if(buf.length===2){html+=`<div class="frow">${buf.join('')}</div>`;buf=[]}}else{if(buf.length){html+=`<div class="frow">${buf.join('')}</div>`;buf=[]}html+=x.h}});
  if(buf.length)html+=`<div class="frow">${buf.join('')}</div>`;
  document.getElementById('sheet').innerHTML=`<h3>${title}</h3>${note?`<div class="small muted" style="margin:-6px 0 12px">${note}</div>`:''}<form id="sheetForm" novalidate>${html}
    <div class="sheet-actions">${onDelete?'<button type="button" class="btn danger" data-act="sheetDel">削除</button>':''}<div class="r"><button type="button" class="btn sub" data-act="sheetClose">キャンセル</button><button type="submit" class="btn">保存</button></div></div></form>`;
  sheetCb={fields,onSave,onDelete,delArmed:false};
  document.getElementById('sheetWrap').hidden=false;
  setTimeout(()=>{const el=document.querySelector('#sheet input,#sheet select');el&&el.focus()},50);
}

/* ===== GAS中継 ===== */
async function bridge(kind,params,post){
  const c=S.conn&&S.conn[kind];
  if(!c||!c.url)throw new Error('接続先が未設定。設定画面の「連携」で入れてね');
  let res;
  if(post){
    res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...params,token:c.token})});
  }else{
    const u=new URL(c.url);Object.entries({...params,token:c.token}).forEach(([k,v])=>u.searchParams.set(k,v));
    res=await fetch(u.toString());
  }
  let j;try{j=await res.json()}catch(e){throw new Error('返事を読めなかった（GASの公開設定が「全員」になっているか確認してね）')}
  if(!j.ok)throw new Error(j.error||'失敗した');
  return j;
}

  if(gBusy||!(S.conn.cal&&S.conn.cal.url))return;
  gBusy=true;if(manual)render();

    S.gcal={at:Date.now(),events:j.events||[]};save();if(manual)toast(`Googleカレンダーから${S.gcal.events.length}件を読み込んだ`);
  }catch(e){if(manual)toast('同期できなかった：'+e.message)}
  gBusy=false;render();
}

async function loadSheets(){
  ui.sh.busy=true;ui.sh.err='';render();
  try{const j=await bridge('sheet',{action:'sheets'});ui.sh.title=j.title;ui.sh.list=j.sheets||[];
    if(!ui.sh.name||!ui.sh.list.some(x=>x.name===ui.sh.name))ui.sh.name=ui.sh.list[0]&&ui.sh.list[0].name;
    if(ui.sh.name)await loadSheet(ui.sh.name,true);}
  catch(e){ui.sh.err=e.message}
  ui.sh.busy=false;render();
}
async function loadSheet(name,inner){
  ui.sh.name=name;if(!inner){ui.sh.busy=true;ui.sh.err='';render()}
  try{const j=await bridge('sheet',{action:'sheet',name});ui.sh.values=j.values||[];ui.sh.formulas=j.formulas||[];ui.sh.more=j.more||0;ui.sh.at=Date.now()}
  catch(e){ui.sh.err=e.message;ui.sh.values=[]}
  if(!inner){ui.sh.busy=false;render()}
}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function sheetView(){
  const c=S.conn.sheet||{};
  if(!c.url)return `<div class="card"><div class="empty">店舗のスプレッドシートとはまだつながっていないよ。<br>設定 →「連携」で、中継用GASのURLと合言葉を入れてね。</div></div>`;

  const head=`<div class="toolbar"><div class="chips">${(ui.sh.list||[]).map(x=>`<button class="chip ${x.name===ui.sh.name?'on':''}" data-act="shPick" data-k="${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div>
    <div style="display:flex;gap:8px">${c.open?`<a class="btn sm sub" href="${esc(c.open)}" target="_blank" rel="noopener">スプシで開く</a>`:''}<button class="btn sm sub" data-act="shReload">${ui.sh.busy?'読み込み中…':'再読み込み'}</button></div></div>`;

  L.push(`今日：${TODAY}（${WD[new Date().getDay()]}）`);
  L.push('【予定・タスク（前後7日）】');
  sortItems(near).sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>L.push(`- ${i.date} ${i.time||''} [${AREAS[i.area].name}/${i.kind==='task'?'タスク':'予定'}${i.done?'/完了':''}] ${i.title}`));
  S.items.filter(i=>i.kind==='task'&&!i.done&&!i.date).forEach(i=>L.push(`- 期限なし [${AREAS[i.area].name}/タスク] ${i.title}`));
  L.push('【案件】');S.deals.forEach(d=>L.push(`- ${d.name}：${d.content}／${d.stage}／次回 ${d.next||'未設定'}`));
  const r=achRate();L.push(`【今月実績】達成率${r.rate}%（月の経過${monthPace()}%）`);S.results.products.forEach(p=>L.push(`- ${p.name} ${p.actual}/${p.target}`));
  const mon=mondayOf(TODAY);L.push('【今週の出勤人数】'+[...Array(7)].map((_,k)=>{const d=addDays(mon,k);return `${fmtD(d)}:${S.members.filter(m=>S.shifts[m+'|'+d]==='出').length}人`}).join(' ')+`（目安${S.minStaff}人）`);
  L.push('【求人・SNS】');S.ads.forEach(a=>L.push(`- ${a.name}：${a.status}／反応${a.apply}／次の更新 ${a.next||'未設定'}`));
  return L.join('\n');
}
const PROMPTS={
  plan:'今日の予定とタスクから、時間順の段取りを組んで。予定の空き時間に入れられるタスクも割り当てて。',
  week:'今後7日の予定・タスク・案件から、優先順位トップ5を理由つきで出して。',
  miss:'データを見て抜け漏れを指摘して（期限切れ、次回アクション未設定の案件、出勤人数が足りない日、更新日が過ぎた求人など）。'
};
function mdLite(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/\n/g,'<br>')}
async function callGemini(){
  const m=(S.settings.model||'gemini-3.8-flash').trim();
  const contents=ui.chat.filter(x=>x.src!=='エラー').slice(-20).map(x=>({role:x.role,parts:[{text:x.send||x.text}]}));
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.apiKey},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYS+'\n\n--- 現在のデータ ---\n'+contextText()}]},contents})});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok)throw new Error(j.error?.message||('HTTP '+res.status));
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'（回答が空だった）';
}
function localAnswer(q){
  const L=[];
  const overdue=S.items.filter(i=>i.kind==='task'&&!i.done&&i.date&&i.date<TODAY);
  const tasks=S.items.filter(i=>i.kind==='task'&&!i.done).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  if(q==='plan'){
    const ev=sortItems(allItems().filter(i=>i.date===TODAY&&i.kind==='event'));
    L.push('**今日の予定**');ev.length?ev.forEach(e=>L.push(`・${e.time||'終日'} ${e.title}`)):L.push('・予定なし');
    L.push('','**空き時間でやること**');tasks.slice(0,3).forEach(t=>L.push(`・${t.title}${t.date&&t.date<TODAY?'（期限切れ）':t.date===TODAY?'（今日まで）':''}`));
    if(!tasks.length)L.push('・なし');
  }else if(q==='week'){
    L.push('**期限の近い順トップ5**');tasks.filter(t=>!t.date||t.date<=addDays(TODAY,7)).slice(0,5).forEach((t,k)=>L.push(`${k+1}. ${t.title}（${t.date?fmtD(t.date):'期限なし'}）`));
    const dn=S.deals.filter(d=>d.next&&d.next<=addDays(TODAY,7)&&!['成約','失注'].includes(d.stage));
    if(dn.length){L.push('','**今週動く案件**');dn.forEach(d=>L.push(`・${d.name}：${d.content}（${fmtD(d.next)}）`))}
  }else if(q==='miss'){
    const noNext=S.deals.filter(d=>!d.next&&!['成約','失注'].includes(d.stage));
    const mon=mondayOf(TODAY);const shortDays=[...Array(7)].map((_,k)=>addDays(mon,k)).filter(d=>S.members.length&&S.members.filter(m=>S.shifts[m+'|'+d]==='出').length<S.minStaff);
    const adLate=S.ads.filter(a=>a.next&&a.next<TODAY);
    if(overdue.length){L.push('**期限切れタスク**');overdue.forEach(t=>L.push(`・${t.title}（${fmtD(t.date)}）`))}
    if(noNext.length){L.push('**次回アクション未設定の案件**');noNext.forEach(d=>L.push(`・${d.name}：${d.content}`))}
    if(shortDays.length){L.push('**出勤が足りない日（今週）**');shortDays.forEach(d=>L.push(`・${fmtD(d)}`))}
    if(adLate.length){L.push('**更新日が過ぎた媒体**');adLate.forEach(a=>L.push(`・${a.name}`))}
    if(!L.length)L.push('いまのデータでは抜け漏れは見つからなかった。');
  }else{
    L.push('自由な質問はAIキーの設定が必要。設定画面でGeminiのAPIキーを入れてね。上の3つのボタンはキーなしでも動くよ。');
  }
  return L.join('\n');
}
const QLABEL={plan:'今日の段取りを組んで',week:'今週の優先順位は？',miss:'抜け漏れをチェックして'};
function scrollChat(){const b=document.getElementById('chatBox');if(b)b.scrollTop=0}
async function runAI(q){
  if(ui.aiBusy)return;
  const draft=(document.getElementById('aiq')?.value||'').trim();
  if(q==='free'&&!draft){toast('質問を入力してね');return}
  ui.chat.push({role:'user',text:q==='free'?draft:QLABEL[q],send:q==='free'?draft:PROMPTS[q]});
  if(q==='free')ui.aiDraft='';
  if(!S.settings.apiKey){ui.chat.push({role:'model',text:localAnswer(q),src:'AI未接続：アプリ内のルールで作成'});renderAI();scrollChat();return}
  ui.aiBusy=true;renderAI();scrollChat();
  try{ui.chat.push({role:'model',text:await callGemini(),src:'Gemini（内容は必ず確認してね）'})}
  catch(e){ui.chat.push({role:'model',text:'AIの呼び出しに失敗した：'+e.message+'\nキーやモデル名を設定画面で確認してね。'+(q!=='free'?'\n\n代わりにルールでの回答：\n'+localAnswer(q):''),src:'エラー'})}
  ui.aiBusy=false;renderAI();scrollChat();
}
function toClaude(){
  const draft=(document.getElementById('aiq')?.value||'').trim();
  const lastQ=[...ui.chat].reverse().find(m=>m.role==='user');
  const q=draft||(lastQ?lastQ.text:'');
  const text=`【${appName()}のデータ】\n${contextText()}\n\n【相談したいこと】\n${q||'（ここに書いてね）'}`;
  if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('データをコピーした。Claudeに貼り付けてね'),()=>{});
  const url=text.length<6000?'https://claude.ai/new?q='+encodeURIComponent(text):'https://claude.ai/new';
  window.open(url,'_blank','noopener');
}

/* ===== 描画とイベント ===== */
const VIEWS={home:vHome,genba:vGenba,nk:vNk,ark:vArk,me:vMe,set:vSet};
function render(){
  document.getElementById('main').innerHTML=launcherBar()+VIEWS[ui.view]();
  document.getElementById('side').innerHTML=`<div class="brandrow"><div class="brand" style="color:var(--accent)">${esc(appName())}</div><button class="paneclose" data-act="lClose" aria-label="メニューを閉じる">${ic('side')}</button></div>`+
    NAV.map(([k,l])=>`${k==='set'?'<div class="spacer"></div>':''}<button class="navbtn ${ui.view===k?'on':''}" data-act="nav" data-v="${k}">${ic(k)}${AREAS[k]?esc(AREAS[k].name):l}${AREAS[k]?`<span class="dot" style="--c:${AREAS[k].c}"></span>`:''}</button>`).join('');
  document.getElementById('tabbar').innerHTML=NAV.filter(n=>n[0]!=='set').map(([k,l])=>`<button class="tab ${ui.view===k?'on':''}" data-act="nav" data-v="${k}">${ic(k)}<span>${AREAS[k]?esc(AREAS[k].name):l}</span></button>`).join('');

/* 埋め込み・表を画面の残りの高さにぴったり合わせて、ページ全体がスクロールしないようにする */
function fitPanels(){
  const main=document.getElementById('main');
  const els=main.querySelectorAll('[data-fit]');
  main.classList.toggle('fit',els.length>0);
  if(!els.length)return;
  window.scrollTo(0,0);
  requestAnimationFrame(()=>{
    const tab=document.getElementById('tabbar');
    const bottom=MQ.matches?14:(tab?tab.getBoundingClientRect().height:0)+10;
    els.forEach(el=>{
      const card=el.closest('.card')||el;
      const extra=card.getBoundingClientRect().bottom-el.getBoundingClientRect().bottom;
      const h=window.innerHeight-el.getBoundingClientRect().top-extra-bottom;
      el.style.height=Math.max(300,Math.floor(h))+'px';
    });
  });
}
function renderAI(){document.getElementById('aipane').innerHTML=aiPane();scrollChat()}
function applyLayout(){
  const wide=MQ.matches,app=document.getElementById('app');
  if(wide){
    const W=window.innerWidth;
    if(LAY.lOpen&&LAY.rOpen&&LAY.lw+LAY.rw>W-380)LAY.rw=Math.max(280,W-380-LAY.lw);
    app.style.gridTemplateColumns=[LAY.lOpen?LAY.lw+'px':'',LAY.lOpen?'6px':'','minmax(0,1fr)',LAY.rOpen?'6px':'',LAY.rOpen?LAY.rw+'px':''].filter(Boolean).join(' ');
  }else app.style.gridTemplateColumns='';
  document.getElementById('side').hidden=wide&&!LAY.lOpen;
  document.getElementById('splitL').hidden=!wide||!LAY.lOpen;
  document.getElementById('splitR').hidden=!wide||!LAY.rOpen;
  document.getElementById('aipane').hidden=wide?!LAY.rOpen:!ui.aiMobile;
}
function initSplit(){
  document.querySelectorAll('.split').forEach(sp=>{
    const left=sp.dataset.split==='left';
    const setW=x=>{const W=window.innerWidth;
      if(left)LAY.lw=clamp(x,160,Math.min(380,W-(LAY.rOpen?LAY.rw:0)-380));
      else LAY.rw=clamp(x,280,Math.min(760,W-(LAY.lOpen?LAY.lw:0)-380));applyLayout()};
    sp.addEventListener('pointerdown',e=>{
      e.preventDefault();sp.setPointerCapture(e.pointerId);sp.classList.add('drag');document.body.style.userSelect='none';
      const move=ev=>setW(left?ev.clientX:window.innerWidth-ev.clientX);
      const up=()=>{sp.removeEventListener('pointermove',move);sp.removeEventListener('pointerup',up);sp.removeEventListener('pointercancel',up);
        sp.classList.remove('drag');document.body.style.userSelect='';saveLay()};
      sp.addEventListener('pointermove',move);sp.addEventListener('pointerup',up);sp.addEventListener('pointercancel',up);
    });
    sp.addEventListener('dblclick',()=>{if(left)LAY.lw=LAY_DEF.lw;else LAY.rw=LAY_DEF.rw;applyLayout();saveLay()});
    sp.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();
      const d=(e.key==='ArrowRight'?16:-16);if(left)setW(LAY.lw+d);else setW(LAY.rw-d);saveLay()});
  });
}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

  seg:el=>{ui.seg[el.dataset.g]=el.dataset.k;ui.past=false;render();if(el.dataset.g==='genba'&&el.dataset.k==='sheet'&&S.conn.sheet.url&&!ui.sh.at&&!ui.sh.busy)loadSheets()},
  pick:el=>{ui.sel=el.dataset.d;ui.week=mondayOf(ui.sel);render()},

  lOpen:()=>{LAY.lOpen=true;saveLay();render()},
  rClose:()=>{if(MQ.matches){LAY.rOpen=false;saveLay()}else ui.aiMobile=false;render()},

  saveNames:()=>{const v=id=>(document.getElementById(id)?.value||'').trim();

  resetLayout:()=>{LAY={...LAY_DEF};saveLay();render();toast('レイアウトを元に戻した')},
  addLaunch:()=>launchSheet(),
  editLaunch:el=>launchSheet(byId(S.launcher,el.dataset.id)),
  chatClear:()=>{ui.chat=[];renderAI()},
  toClaude:()=>toClaude(),
  theme:el=>setTheme(el.dataset.k),
  themeCycle:()=>{const i=THEMES.findIndex(t=>t[0]===theme);setTheme(THEMES[(i+1)%THEMES.length][0])},
  toggle:el=>{const i=byId(S.items,el.dataset.id);if(i){i.done=!i.done;commit(i.done?'完了！':'未完了に戻した')}},
  edit:el=>{const id=el.dataset.id;if(id.startsWith('g_')){const g=gItems().find(x=>x.id===id);if(g)gEventSheet(g);return}const i=byId(S.items,id);if(i)itemSheet(i)},
  gsync:()=>syncCal(true),
  shPick:el=>loadSheet(el.dataset.k),
  shReload:()=>loadSheets(),
  cell:el=>cellSheet(+el.dataset.r,+el.dataset.c),
  embPick:el=>{ui.emb=el.dataset.k;render()},
  embAdd:()=>embSheet(),
  embBulk:()=>embBulkSheet(),
  embEdit:el=>embSheet(S.embeds.find(x=>x.id===el.dataset.k)),
  connTest:async el=>{const k=el.dataset.k;readConn();save();el.textContent='確認中…';
    try{const j=await bridge(k,{action:'ping'});toast('つながった：'+(j.me||'OK'));if(k==='cal')syncCal(false)}catch(e){toast('つながらない：'+e.message)}

  newMonth:()=>{const r=S.results;r.history=r.history||[];r.history.push({month:r.month,products:r.products.map(p=>({name:p.name,target:p.target,actual:p.actual}))});r.month=THIS_MONTH;r.products.forEach(p=>p.actual=0);commit('今月に切り替えた')},

function readConn(){const v=id=>(document.getElementById(id)?.value||'').trim();
